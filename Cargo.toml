[package]
name = "breeze-token"
version = "1.0.0"
description = "A V3 air conditioner's token and key, from the Midea account it is paired with, for any Breeze Core"
edition = "2021"
# It links Breeze Core's own crates, which are AGPL.
license = "AGPL-3.0-or-later"
authors = ["Monika <monika.purpl3@gmail.com>"]
publish = false

[dependencies]
# Breeze Core's own crates, at a release: the cloud flows, discovery and the V3
# handshake that checks a token, and config.json exactly as Breeze Core writes
# it. Nothing here re-implements them.
breeze-cloud = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
breeze-device = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
breeze-proto = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
breeze-store = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
serde_json = "1"
# The same ureq breeze-cloud uses, so talking to a server costs nothing extra.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rpassword = "7"
# Pairing with a server that wants signed requests (auth version 2).
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
sha3 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[dev-dependencies]
# The end-to-end test pairs a device with the servers, stored hashed.
sha2 = "0.10"

[features]
# A pretend Midea cloud read from BREEZE_TOKEN_FAKE_CLOUD, for the end-to-end
# test. Never in a release: a build with it says so on every run.
fake-cloud = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
